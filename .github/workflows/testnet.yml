# Live XRPL Testnet lifecycle suite (XRPL-050), run by hand: Actions → "Testnet lifecycle" → Run workflow.
# Not triggered by pull requests: it depends on the public Testnet and its faucet, which can be slow or down.
# See tests/testnet/README.md. No secrets: wallets are throwaway faucet accounts that live only in the job.
name: Testnet lifecycle

on:
  workflow_dispatch:

permissions:
  contents: read

# One run at a time, so manual runs don't compete for the public faucet.
concurrency:
  group: testnet-lifecycle
  cancel-in-progress: false

jobs:
  testnet:
    name: Ticket lifecycle on XRPL Testnet
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: xrpl
          POSTGRES_PASSWORD: xrpl_ci_only
          POSTGRES_DB: xrpl_ticketing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xrpl -d xrpl_ticketing"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Credentials for the job's own throwaway container, not a secret.
      DATABASE_URL: postgresql://xrpl:xrpl_ci_only@localhost:5432/xrpl_ticketing
      TEST_DATABASE_URL: postgresql://xrpl:xrpl_ci_only@localhost:5432/xrpl_ticketing_test
      XRPL_NETWORK: testnet
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Create the test database
        run: docker exec -i "${{ job.services.postgres.id }}" psql -v ON_ERROR_STOP=1 -U xrpl -d xrpl_ticketing < docker/postgres/init/01-create-test-db.sql
      - name: Lifecycle suite against XRPL Testnet
        run: npm run test:testnet
